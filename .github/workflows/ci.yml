name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Reproduce and verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the test suite against committed outputs
        run: pytest -v

      - name: Re-run the full pipeline from scratch
        run: python run_all.py

      - name: Check the pipeline reproduced the committed outputs exactly
        run: |
          git diff --exit-code -- data/ charts/ \
            || (echo "::error::Committed outputs are stale — re-run 'python run_all.py' and commit the result." && exit 1)

      - name: Re-run the tests against the freshly generated outputs
        run: pytest -q
