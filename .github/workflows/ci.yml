name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Reproduce and verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Record the environment
        run: |
          python -VV
          pip list

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the test suite against committed outputs
        run: pytest -v

      - name: Snapshot the committed outputs
        run: |
          mkdir -p _snapshot
          cp -r data results charts _snapshot/

      - name: Re-run the full pipeline from scratch
        run: python run_all.py

      - name: Check the regenerated outputs match what was committed
        run: python scripts/check_reproducibility.py _snapshot

      - name: Re-run the tests against the freshly generated outputs
        run: pytest -q
